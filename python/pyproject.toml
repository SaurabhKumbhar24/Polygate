[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polygate"
version = "0.2.0"
description = "One consistent function to call any LLM provider — Anthropic, OpenAI, Gemini, Moonshot, and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Saurabh Kumbhar" }
]
dependencies = [
    "requests>=2.25"
]
keywords = ["llm", "ai", "gateway", "anthropic", "claude", "openai", "gemini", "moonshot", "kimi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://polygate.getfluiq.com"
Documentation = "https://polygate.getfluiq.com"
Repository = "https://github.com/SaurabhKumbhar24/polygate"
Issues = "https://github.com/SaurabhKumbhar24/polygate/issues"

[tool.hatch.build.targets.wheel]
packages = ["polygate"]
