name: Publish SDKs

# Publishes the Python package to PyPI and the TypeScript package to npm
# on every push to main. Each job first checks whether the version in its
# manifest is already on the registry and skips publishing if so, so an
# ordinary commit to main (docs, tests, source without a version bump)
# won't fail the build. To release: bump the version in the manifest(s)
# and push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-python:
    name: Publish Python to PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Local version: $VERSION"

      - name: Check if version already on PyPI
        id: check
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/polygate/${{ steps.ver.outputs.version }}/json")
          if [ "$CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "polygate ${{ steps.ver.outputs.version }} already on PyPI — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tooling
        if: steps.check.outputs.exists == 'false'
        run: python -m pip install --upgrade build twine

      - name: Run tests
        if: steps.check.outputs.exists == 'false'
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.exists == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*

  publish-typescript:
    name: Publish TypeScript to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Read version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Local version: $VERSION"

      - name: Check if version already on npm
        id: check
        run: |
          PUBLISHED=$(npm view "polygate@${{ steps.ver.outputs.version }}" version 2>/dev/null || true)
          if [ -n "$PUBLISHED" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "polygate ${{ steps.ver.outputs.version }} already on npm — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm install

      - name: Test
        if: steps.check.outputs.exists == 'false'
        run: npm test

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
